services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: basis_social
      POSTGRES_USER: basis
      POSTGRES_PASSWORD: basis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basis -d basis_social"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: basis
      MINIO_ROOT_PASSWORD: basis-basis
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      API_BIND: 0.0.0.0:8080
      PUBLIC_URL: http://localhost:8080
      HTTP_READ_HEADER_TIMEOUT: 5s
      HTTP_READ_TIMEOUT: 30s
      HTTP_IDLE_TIMEOUT: 2m
      HTTP_MAX_HEADER_BYTES: 1048576
      HTTP_SHUTDOWN_TIMEOUT: 15s
      DATABASE_URL: postgres://basis:basis@postgres:5432/basis_social?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      REALTIME_BUFFER_SIZE: 128
      REALTIME_BUS_BUFFER_SIZE: 1024
      REALTIME_REDIS_CHANNEL: basisvr:realtime:v1
      REALTIME_REDIS_PUBLISH_TIMEOUT: 2s
      REALTIME_REPLAY_ENABLED: "true"
      REALTIME_REPLAY_RETENTION: 24h
      REALTIME_REPLAY_MAX_ENTRIES: 10000
      REALTIME_REPLAY_LIMIT: 500
      REALTIME_REPLAY_PREFIX: basisvr:realtime
      REALTIME_REPLAY_STORE_TIMEOUT: 250ms
      PRESENCE_SWEEP_INTERVAL: 15s
      PRESENCE_SWEEP_BATCH_SIZE: 500
      MAX_REQUEST_BODY_BYTES: 8388608
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: 600
      RATE_LIMIT_WINDOW: 1m
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      AUTH_RATE_LIMIT_REQUESTS: ${AUTH_RATE_LIMIT_REQUESTS:-20}
      CORS_ALLOWED_ORIGINS: ""
      METRICS_ENABLED: "true"
      JSON_LOGS_ENABLED: "true"
      READINESS_TIMEOUT: 2s
      JWT_SECRET: dev-secret-change-me
      ACTOR_KEY_ENCRYPTION_KEY: ${ACTOR_KEY_ENCRYPTION_KEY:?Set a persistent base64 32-byte actor wrapping key}
      BEEBA_IDENTITY_ENABLED: ${BEEBA_IDENTITY_ENABLED:-false}
      BEEBA_IDENTITY_API_URL: ${BEEBA_IDENTITY_API_URL:-}
      BEEBA_IDENTITY_PUBLIC_URL: ${BEEBA_IDENTITY_PUBLIC_URL:-}
      BEEBA_IDENTITY_SECRET: ${BEEBA_IDENTITY_SECRET:-}
      BEEBA_IDENTITY_TIMEOUT: ${BEEBA_IDENTITY_TIMEOUT:-3s}
      REGISTRATION_ENABLED: "true"
      FEDERATION_MODE: disabled
      ACTIVITYPUB_ENABLED: "false"
      ACTIVITYPUB_DOMAIN: localhost
      ASSET_CATALOG_ENABLED: "false"
      ASSET_CATALOG_CODE: beeba
      ASSET_CATALOG_NAME: BeeBa Asset Catalog
      ASSET_CATALOG_KIND: beeba
      ASSET_CATALOG_BASE_URL: ""
      ASSET_CATALOG_API_BASE_URL: ""
      ASSET_CATALOG_API_TOKEN: ""
      ASSET_CATALOG_TIMEOUT: 5s
    command: ["/bin/sh", "-c", "/app/migrate up && /app/api"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  delivery:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://basis:basis@postgres:5432/basis_social?sslmode=disable
      ACTIVITYPUB_FETCH_TIMEOUT: 10s
      ACTIVITYPUB_MAX_DELIVERY_ATTEMPTS: 6
      ACTOR_KEY_ENCRYPTION_KEY: ${ACTOR_KEY_ENCRYPTION_KEY:?Set a persistent base64 32-byte actor wrapping key}
    command: ["/app/delivery"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  retention:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://basis:basis@postgres:5432/basis_social?sslmode=disable
      RETENTION_INTERVAL: 1h
      RETENTION_BATCH_SIZE: 1000
    command: ["/app/retention"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: basisvr-local
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
