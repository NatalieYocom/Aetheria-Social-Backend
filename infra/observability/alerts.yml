groups:
  - name: basisvr-social
    rules:
      - alert: BasisVRSocialAPIDown
        expr: up{job="basisvr-social-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: BasisVR Social API is unavailable
      - alert: BasisVRSocialElevated5xx
        expr: sum(rate(basisvr_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(basisvr_http_requests_total[5m])), 0.001) > 0.02
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API 5xx ratio is above 2 percent
      - alert: BasisVRSocialLatencySLOBreach
        expr: histogram_quantile(0.95, sum by (le) (rate(basisvr_http_request_duration_seconds_bucket[10m]))) > 0.3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency is above 300 milliseconds
      - alert: BasisVRRealtimeReplayStoreFailures
        expr: increase(basisvr_realtime_replay_store_failures_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Realtime events are failing to persist in Redis Streams
      - alert: BasisVRRealtimeFrequentResync
        expr: increase(basisvr_realtime_replay_resync_required_total[15m]) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Clients frequently require full realtime state resync
      - alert: BasisVRActivityPubDeliveryBacklog
        expr: basisvr_activitypub_outbox_oldest_pending_seconds > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Oldest ActivityPub delivery job is more than five minutes old
      - alert: BasisVRActivityPubDeliveryFailures
        expr: basisvr_activitypub_outbox_jobs{state="failed"} > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: ActivityPub delivery failures require review
      - alert: BasisVRActivityPubMetricsUnavailable
        expr: basisvr_activitypub_metrics_scrape_error == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: ActivityPub queue metrics cannot be read from PostgreSQL
